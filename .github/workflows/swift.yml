name: Swift

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Test Engineering impact policy
        run: python3 Tests/ScriptTests/engineering-impact-policy-tests.py
      - name: Fetch exact Engineering impact comparison revisions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git fetch --no-tags --depth=1 "$HEAD_REPO_URL" "$HEAD_SHA"
      - name: Validate Engineering impact classification
        if: github.event_name == 'pull_request'
        run: python3 scripts/validate-engineering-impact.py "$GITHUB_EVENT_PATH"
      - name: Report Swift toolchain
        if: github.event.action != 'edited'
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version
      - name: Install Metal toolchain
        if: github.event.action != 'edited'
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Resolve dependency graph
        if: github.event.action != 'edited'
        run: swift package resolve
      - name: Report package schemes
        if: github.event.action != 'edited'
        run: xcodebuild -list
      - name: Retain resolved dependency graph
        if: github.event_name == 'pull_request' && github.event.action != 'edited'
        uses: actions/upload-artifact@v4
        with:
          name: InterviewArcLive-Package.resolved-${{ github.sha }}
          path: Package.resolved
          if-no-files-found: error
          retention-days: 2
      - name: Build package and tests with Metal
        if: github.event.action != 'edited'
        env:
          INTERVIEW_ARC_LIVE_DERIVED_DATA_PATH: ${{ runner.temp }}/InterviewArcLiveDerivedData
        run: |
          xcodebuild build-for-testing \
            -scheme InterviewArcLive-Package \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$INTERVIEW_ARC_LIVE_DERIVED_DATA_PATH" \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGNING_ALLOWED=NO
      - name: Test package
        if: github.event.action != 'edited'
        env:
          INTERVIEW_ARC_LIVE_DERIVED_DATA_PATH: ${{ runner.temp }}/InterviewArcLiveDerivedData
        run: |
          xcodebuild test-without-building \
            -scheme InterviewArcLive-Package \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$INTERVIEW_ARC_LIVE_DERIVED_DATA_PATH" \
            -parallel-testing-enabled NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGNING_ALLOWED=NO
      - name: Prepare release-equivalent package products
        if: github.event.action != 'edited'
        env:
          INTERVIEW_ARC_LIVE_DERIVED_DATA_PATH: ${{ runner.temp }}/InterviewArcLiveDerivedData
        run: |
          xcodebuild build \
            -scheme InterviewArcLive-Package \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$INTERVIEW_ARC_LIVE_DERIVED_DATA_PATH" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            ENABLE_TESTABILITY=NO \
            CODE_SIGNING_ALLOWED=NO
          printf 'source_commit=%s\nscheme=%s\nconfiguration=%s\nenable_testability=%s\nmacosx_deployment_target=%s\ncode_signing_allowed=%s\n' \
            "$GITHUB_SHA" "InterviewArcLive-Package" "Release" "NO" "14.0" "NO" \
            > "$INTERVIEW_ARC_LIVE_DERIVED_DATA_PATH/InterviewArcLive.source-commit"
      - name: Test installer safety
        if: github.event.action != 'edited'
        run: Tests/ScriptTests/install-app-tests.zsh
      - name: Test installed Codex smoke safety
        if: github.event.action != 'edited'
        run: Tests/ScriptTests/codex-smoke-tests.zsh
      - name: Test installed endpoint smoke safety
        if: github.event.action != 'edited'
        run: Tests/ScriptTests/endpoint-smoke-tests.zsh
      - name: Test installed local-speech smoke safety
        if: github.event.action != 'edited'
        run: Tests/ScriptTests/speech-smoke-tests.zsh
      - name: Test local Board editor and application icon
        if: github.event.action != 'edited'
        run: Tests/ScriptTests/board-editor-assets-tests.zsh
      - name: Package exact source from a clean worktree
        if: github.event.action != 'edited'
        env:
          INTERVIEW_ARC_LIVE_DERIVED_DATA_PATH: ${{ runner.temp }}/InterviewArcLiveDerivedData
          PACKAGE_SOURCE: ${{ runner.temp }}/InterviewArcLivePackageSource
        run: |
          git worktree add --detach "$PACKAGE_SOURCE" "$GITHUB_SHA"
          "$PACKAGE_SOURCE/scripts/package-app.sh" release
          mkdir -p dist
          /usr/bin/ditto \
            "$PACKAGE_SOURCE/dist/Interview Arc Live.app" \
            "dist/Interview Arc Live.app"
          cp \
            "$PACKAGE_SOURCE/dist/InterviewArcLive.package-manifest.txt" \
            "dist/InterviewArcLive.package-manifest.txt"
      - name: Upload merged application
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: InterviewArcLive-${{ github.sha }}
          path: |
            dist/Interview Arc Live.app
            dist/InterviewArcLive.package-manifest.txt
          if-no-files-found: error
          retention-days: 14
