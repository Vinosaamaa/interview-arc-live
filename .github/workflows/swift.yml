name: Swift

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Test Engineering impact policy
        run: python3 Tests/ScriptTests/engineering-impact-policy-tests.py
      - name: Fetch exact Engineering impact comparison revisions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
      - name: Validate Engineering impact classification
        if: github.event_name == 'pull_request'
        run: python3 scripts/validate-engineering-impact.py "$GITHUB_EVENT_PATH"
      - name: Report Swift toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Resolve dependency graph
        run: swift package resolve
      - name: Report package schemes
        run: xcodebuild -list
      - name: Retain resolved dependency graph
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: InterviewArcLive-Package.resolved-${{ github.sha }}
          path: Package.resolved
          if-no-files-found: error
          retention-days: 2
      - name: Build package and tests with Metal
        env:
          INTERVIEW_ARC_LIVE_DERIVED_DATA_PATH: ${{ runner.temp }}/InterviewArcLiveDerivedData
        run: |
          xcodebuild build-for-testing \
            -scheme InterviewArcLive-Package \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$INTERVIEW_ARC_LIVE_DERIVED_DATA_PATH" \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            ENABLE_TESTABILITY=YES \
            CODE_SIGNING_ALLOWED=NO
      - name: Test package
        env:
          INTERVIEW_ARC_LIVE_DERIVED_DATA_PATH: ${{ runner.temp }}/InterviewArcLiveDerivedData
        run: |
          xcodebuild test-without-building \
            -scheme InterviewArcLive-Package \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$INTERVIEW_ARC_LIVE_DERIVED_DATA_PATH" \
            -parallel-testing-enabled NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            ENABLE_TESTABILITY=YES \
            CODE_SIGNING_ALLOWED=NO
      - name: Test installer safety
        run: Tests/ScriptTests/install-app-tests.zsh
      - name: Test installed Codex smoke safety
        run: Tests/ScriptTests/codex-smoke-tests.zsh
      - name: Test installed endpoint smoke safety
        run: Tests/ScriptTests/endpoint-smoke-tests.zsh
      - name: Test installed local-speech smoke safety
        run: Tests/ScriptTests/speech-smoke-tests.zsh
      - name: Test local Board editor and application icon
        run: Tests/ScriptTests/board-editor-assets-tests.zsh
      - name: Package application
        env:
          INTERVIEW_ARC_LIVE_DERIVED_DATA_PATH: ${{ runner.temp }}/InterviewArcLivePackageDerivedData
        run: scripts/package-app.sh release
      - name: Upload merged application
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: InterviewArcLive-${{ github.sha }}
          path: |
            dist/Interview Arc Live.app
            dist/InterviewArcLive.package-manifest.txt
          if-no-files-found: error
          retention-days: 14
